<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>join</title>
</head>
<body>
<h2>로그인 페이지</h2>
<button type="button" id="backBtn" onclick="location.href='/'">뒤로가기</button>
<form th:action="@{/loginProc}" method="post" name="loginForm" th:object="${loginUserDto}">
  <br>
  <div>
    <label for="email">이메일</label>
    <input id="email" type="text" name="email" th:field="*{email}" placeholder="id"/>
    <div th:errors="*{email}" >이메일 오류</div>
  </div>
  <br>
  <div>
    <label for="password">패스워드</label>
    <input id="password" type="password" name="password" th:field="*{password}" placeholder="password"/>
    <div th:errors="*{password}">패스워드 오류</div>
  </div>
  <br>
  <div>
    <input type="submit" value="로그인">
    <button type="button" id="joinBtn" onclick="location.href='/join'">회원가입</button>
  </div>
</form>
</body>
</html>
