<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8">
  <title>Title</title>
</head>
<body>
<h2>블랙리스트 목록</h2>
<input type="button" onclick="location.href='/admin'" value="어드민 홈으로">
<div>
  <table>
    <thead>
    <tr>
      <th>이메일</th>
      <th>사유</th>
      <th>등록 관리자 닉네임</th>
      <th>등록 시간</th>
    </tr>
    </thead>
    <tr th:each="blacklist : ${blacklists}">
      <td th:text="${blacklist.email}"></td>
      <td th:text="${blacklist.reason}"></td>
      <td th:text="${blacklist.blacklistedBy}"></td>
      <td th:text="${blacklist.blacklistedAt}"></td>
      <td>
        <form th:action="@{/admin/blacklist/delete/{email}(email=${blacklist.email})}" method="post">
          <input type="submit" value="블랙리스트 등록 해제">
        </form>
      </td>
      <p style="margin: 20px 0;">
    </tr>
  </table>
</div>
</body>
</html>
