<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<h2>유저관리</h2>
<input type="button" onclick="location.href='/admin'" value="어드민 홈으로">
<div>
  <table>
    <thead>
      <tr>
        <th>이메일</th>
        <th>닉네임</th>
        <th>전화번호</th>
        <th>등급</th>
        <th>마일리지</th>
      </tr>
    </thead>
  <tr th:each="user : ${users}">
    <td th:text="${user.email}"></td>
    <td th:text="${user.nickname}"></td>
    <td th:text="${user.phone}"></td>
    <td th:text="${user.grade}"></td>
    <td th:text="${user.mileage}"></td>
    <td>
      <input type="button" value="블랙리스트 동록" th:onclick="|location.href='@{/admin/blacklist/add/{email}(email=${user.email})}'|">
    </td>
      <p style="margin: 20px 0;">
  </tr>
  </table>
</div>

</body>
</html>
